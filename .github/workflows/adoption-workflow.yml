name: Verified adoption workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adoption-workflow.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "tools/test_adoption_workflow.sh"
      - "typewriter/**"
  pull_request:
    paths:
      - ".github/workflows/adoption-workflow.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "tools/test_adoption_workflow.sh"
      - "typewriter/**"

permissions:
  contents: read

concurrency:
  group: adoption-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-sample:
    name: Build and exercise clean sample
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build release candidate
        run: |
          python -m pip install build ".[docs]"
          python -m build

      - name: Build documentation strictly
        run: python -m mkdocs build --strict --clean

      - name: Exercise documented adoption path
        run: tools/test_adoption_workflow.sh dist/py_typewriter_cli-1.2.0-py3-none-any.whl
