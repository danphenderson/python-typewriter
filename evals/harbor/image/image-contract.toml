contract_version = 1
harbor_schema_version = "1.4"
harbor_version = "0.21.0"

local_image = "python-typewriter-harbor:maintenance-v1"
published_repository = "ghcr.io/danphenderson/python-typewriter-harbor"
published_tag = "maintenance-v1"

base_image = "python:3.10.21-slim-bookworm@sha256:673f009e3763f8d03953b525c89b03a9ee8ca315bf6b8006979b5c4a4e2e4d68"
rust_image = "rust:1.85.1-slim-bookworm@sha256:9f841bbe9e7d8e37ceb96ed907265a3a0df7f44e3737d0b100e7907a679acb36"
uv_version = "0.11.26"
python_versions = ["3.10.21", "3.11.15", "3.12.13", "3.13.14"]

[network]
# Harbor 0.21's Docker provider may reject its sidecar-backed no-network mode
# when the Docker host kernel lacks nftables support. The generated Compose
# overlay still gives the main container Docker's native `network_mode: none`.
harbor_mode = "public"
docker_main_network_mode = "none"

[workspace]
path = "/workspace/typewriter"
agent_user = "agent"

[rebuild]
inputs = [
    "evals/harbor/image/**",
    ".pre-commit-config.yaml",
    "pyproject.toml",
]
